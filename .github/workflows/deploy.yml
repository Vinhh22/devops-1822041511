name: CI/CD Pipeline

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  check:
    name: Kiểm tra mã nguồn (Code Quality Check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Kiểm tra sự tồn tại của 3 file bắt buộc
        run: |
          echo "Kiểm tra 3 file: index.html, style.css, script.js..."
          if [ ! -f index.html ] || [ ! -f style.css ] || [ ! -f script.js ]; then
            echo "::error::Thiếu file bắt buộc trong thư mục dự án!"
            exit 1
          fi
          echo "Đã đủ 3 file."

      - name: Kiểm tra thẻ <title> trong file index.html
        run: |
          echo "Kiểm tra thẻ <title>..."
          if ! grep -q -i "<title>" index.html || ! grep -q -i "</title>" index.html; then
            echo "::error::File index.html thiếu thẻ <title> hợp lệ!"
            exit 1
          fi
          echo "Kiểm tra thẻ <title> thành công."

  deploy:
    name: Triển khai lên GitHub Pages (Deploy)
    needs: check
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập GitHub Pages
        uses: actions/configure-pages@v5

      - name: Tải lên Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Triển khai lên GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

